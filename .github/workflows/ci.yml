name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  suites:
    # windows-latest per HARNESS-004 (#70): the control plane is Windows-native
    # (icacls ACL hardening, Job Objects, path semantics), and the flat-install
    # regression (#92) shipped precisely because nothing ran the installed
    # layout anywhere. Ubuntu would green-light code that cannot run here.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Suite matrix
        shell: pwsh
        run: |
          $suites = @(
            "harnesses/kimi-code/delegate/tests",
            "harnesses/codex/delegate/tests",
            "harnesses/codex/skill/model-proctor/tests",
            "harnesses/kimi-code/runner/tests",
            "harnesses/kimi-code/replay/tests",
            "harnesses/kimi-code/wirewatch/tests",
            "harnesses/kimi-code/loop/tests",
            "core/tests",
            "scripts/tests",
            "evals/tests",
            "harnesses/zcode/tests"
          )
          $failed = 0
          $current = [ordered]@{}
          foreach ($s in $suites) {
            Write-Host "=== $s ==="
            python -m unittest discover -s $s 2>&1 | Tee-Object -Variable out
            $code = $LASTEXITCODE
            $text = $out | Out-String
            $ran = [regex]::Match($text, '(?m)^Ran (\d+) tests? in')
            $skip = [regex]::Match($text, 'skipped=(\d+)')
            $bad = 0
            foreach ($m in [regex]::Matches($text, '(?:failures|errors)=(\d+)')) { $bad += [int]$m.Groups[1].Value }
            if ($code -ne 0 -and $bad -eq 0) { $bad = 1 }
            $current[$s] = [ordered]@{
              ran = $(if ($ran.Success) { [int]$ran.Groups[1].Value } else { 0 })
              skipped = $(if ($skip.Success) { [int]$skip.Groups[1].Value } else { 0 })
              failed = $bad
            }
            if ($code -ne 0) { $failed = 1; Write-Host "SUITE FAILED: $s" }
          }
          $current | ConvertTo-Json | Set-Content current-counts.json -Encoding utf8
          if ($failed -eq 1) { exit 1 }
      - name: Test counts must not fall below the committed baseline
        shell: pwsh
        run: |
          # A suite that loses tests, gains skips or runs nothing fails here
          # even though every remaining test passes. docs/baseline/baseline.json
          # changes only by a reviewed commit (CODEOWNERS).
          python scripts/check_baseline.py --baseline docs/baseline/baseline.json --current current-counts.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Real install into temp dirs, then required files must exist there
        shell: pwsh
        run: |
          # Installs through install.py itself, into temp dirs, so nothing under
          # C:\Tools or the runner's real profile is touched.
          $tools = Join-Path $env:RUNNER_TEMP "tools"
          $skills = Join-Path $env:RUNNER_TEMP "skills"
          python scripts/install.py --tool-dir $tools --skills-dir $skills
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "import sys, pathlib; sys.path.insert(0, 'scripts'); import install; t = pathlib.Path(sys.argv[1]); missing = [n for n in install.REQUIRED_AFTER_INSTALL if not (t / n).is_file()]; print('missing:', missing); sys.exit(1 if missing else 0)" $tools
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path (Join-Path $skills "model-proctor/SKILL.md"))) { Write-Host "skill not installed"; exit 1 }
